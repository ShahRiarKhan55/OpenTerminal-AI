name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` installs exactly what package-lock.json pins (and fails if the
      # lockfile is out of sync), so CI is reproducible. `npm install` is not.
      - run: npm ci
      - run: npm test # server + web unit/integration/security tests
      - run: npm run build -w server
      - run: npm run build -w web

  # Dependencies are at zero known advisories (prod AND dev tooling). Any new advisory at or above
  # "high" fails this job, so it cannot be merged unnoticed. Fix with `npm audit fix` or an upgrade.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # Real browser + real processes: the dashboard against a seeded stack, a cross-origin attacker page,
  # and the compiled worker. Slow (~1-2 min), so it runs after the fast checks succeed.
  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/out/
          if-no-files-found: ignore
